<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Student Grade Portal | Smart Lookup</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fc;
            font-family: 'Inter', sans-serif;
            color: #1a2634;
            padding: 2rem 1.5rem;
            line-height: 1.4;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* header */
        .portal-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .portal-header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1e2a3a, #2c3e50);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }
        .portal-header p {
            color: #5b6e8c;
            font-weight: 400;
            margin-top: 0.5rem;
            font-size: 1rem;
        }
        .badge-light {
            display: inline-block;
            background: #eef2f9;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #2c3e66;
            margin-top: 0.8rem;
        }

        /* card style */
        .card {
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05), 0 2px 4px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
            overflow: hidden;
            border: 1px solid #eef2f8;
        }

        /* search section */
        .search-section {
            background: white;
            border-radius: 32px;
            padding: 1.8rem 2rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1.2rem;
        }
        .input-group {
            flex: 2;
            min-width: 240px;
        }
        .input-group label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #4a627a;
            display: block;
            margin-bottom: 0.5rem;
        }
        .input-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            font-size: 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 20px;
            font-family: 'Inter', monospace;
            transition: 0.2s;
            background: #ffffff;
            color: #0f172a;
        }
        .input-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }
        .btn-primary {
            background: #1e293b;
            color: white;
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .btn-primary i {
            font-size: 1rem;
        }
        .btn-primary:hover {
            background: #0f172a;
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.08);
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid #cbd5e1;
            padding: 0.9rem 1.5rem;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            color: #334155;
        }
        .btn-outline:hover {
            border-color: #1e293b;
            background: #f8fafc;
        }

        /* result area */
        .result-area {
            margin-bottom: 2rem;
        }
        .grade-card {
            padding: 1.6rem 2rem;
            background: white;
        }
        .student-identity {
            border-bottom: 2px solid #f0f3f9;
            padding-bottom: 1.2rem;
            margin-bottom: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
        }
        .student-name {
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #0f172a;
        }
        .student-id-badge {
            background: #eef2ff;
            padding: 0.3rem 1rem;
            border-radius: 100px;
            font-weight: 500;
            font-size: 0.85rem;
            color: #1e40af;
        }
        .grades-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.8rem;
            margin-bottom: 2rem;
        }
        .grade-item {
            background: #f9fbfe;
            border-radius: 28px;
            padding: 1.2rem 1.8rem;
            flex: 1;
            min-width: 150px;
            text-align: center;
            border: 1px solid #edf2f7;
        }
        .grade-label {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #5b6e8c;
            letter-spacing: 0.5px;
            margin-bottom: 0.6rem;
        }
        .grade-value {
            font-size: 2.7rem;
            font-weight: 800;
            color: #1f2b38;
            line-height: 1;
        }
        .grade-unit {
            font-size: 1rem;
            font-weight: 500;
            color: #6f8fae;
        }
        .absent-tag {
            background: #fee2e2;
            color: #b91c1c;
            padding: 0.2rem 1rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-block;
        }
        /* comment block */
        .comment-block {
            margin-top: 1.2rem;
            background: #ffffff;
            border-radius: 28px;
            border: 1px solid #eef2f8;
            overflow: hidden;
            transition: 0.2s;
        }
        .comment-header {
            background: #f8fafd;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #eef2f8;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1e293b;
        }
        .comment-body {
            padding: 1.2rem 1.5rem 1.5rem;
        }
        textarea {
            width: 100%;
            border: 1.5px solid #e2e8f0;
            border-radius: 20px;
            padding: 1rem;
            font-family: 'Inter', monospace;
            font-size: 0.9rem;
            resize: vertical;
            background: #ffffff;
            transition: 0.2s;
        }
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
        }
        .comment-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 0.8rem;
            gap: 12px;
        }
        .btn-save {
            background: #eef2ff;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            color: #1e3a8a;
            transition: 0.2s;
        }
        .btn-save:hover {
            background: #e0e7ff;
        }
        .message-toast {
            font-size: 0.8rem;
            color: #2b6e3c;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .error-message {
            background: #fff6f0;
            border-left: 5px solid #f97316;
            padding: 1.2rem;
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #9b2c1d;
        }
        hr {
            margin: 1rem 0;
            border: none;
            border-top: 1px solid #eef2f8;
        }
        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: #8196af;
            margin-top: 2rem;
        }
        @media (max-width: 640px) {
            body {
                padding: 1.2rem;
            }
            .student-name {
                font-size: 1.3rem;
            }
            .grade-value {
                font-size: 2rem;
            }
            .search-section {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="portal-header">
        <h1><i class="fas fa-graduation-cap" style="margin-right: 8px; color:#2c3e66;"></i> Grade Compass</h1>
        <p>Secure student portal · instant results & personal notes</p>
        <div class="badge-light"><i class="far fa-id-card"></i> Enter your student ID to access grades</div>
    </div>

    <!-- Search panel -->
    <div class="card search-section">
        <div class="input-group">
            <label><i class="fas fa-id-badge"></i> Student ID</label>
            <input type="text" id="studentIdInput" placeholder="e.g., 22Pxxxx" autocomplete="off">
        </div>
        <button class="btn-primary" id="lookupBtn"><i class="fas fa-search"></i> Find my grades</button>
        <button class="btn-outline" id="resetBtn"><i class="fas fa-undo-alt"></i> Clear</button>
    </div>

    <!-- Dynamic result panel -->
    <div id="resultContainer" class="result-area"></div>

    <div class="footer-note">
        <i class="far fa-comment-dots"></i> Comments are saved per student & per session (local storage) — your feedback remains private.
    </div>
</div>

<script>
    // ---------- STUDENT GRADE DATABASE (based on given table) ----------
    // Normalized dataset: ID as key (case-insensitive matching, but stored as original)
    const studentsRaw = [
        { name: "Abdelmajed Hatem", id: "22P0234", email: "majedhatem201004@gmail.com", quiz1: 9.75, midterm: 18, status: "active" },
        { name: "Malak Sameh Abdelaziz Mansour", id: "2201397", email: "malaksameh352@gmail.com", quiz1: 8.5, midterm: 18, status: "active" },
        { name: "Omar Mohamed Rady", id: "22P0098", email: "omarrady20004@gmail.com", quiz1: 4.5, midterm: 15, status: "active" },
        { name: "Aly Mohamed Hussein", id: "22p0018", email: "aly moahmed539@gmail.com", quiz1: 8.75, midterm: 14.5, status: "active" },
        { name: "Rana Essam", id: "22p0061", email: "rana1essam2@gmail.com", quiz1: 6, midterm: 13, status: "active" },
        { name: "Carol Micheal Farouk Ishak", id: "22P0030", email: "carol.micheal05@gmail.com", quiz1: 8.25, midterm: 18, status: "active" },
        { name: "Mohab Magdy", id: "22P0104", email: "mohabsensei@gmail.com", quiz1: 0, midterm: "absent", status: "absent_mid" },
        { name: "Ezzeldin Ahmed Ezzeldin Hafez Hasan", id: "22P0050", email: "ezzeldin14735@gmail.com", quiz1: 7, midterm: 17, status: "active" },
        { name: "Ziad Ahmed Mohamed Nader Abdee", id: "22P0059", email: "zyaddabdellatif@gmail.com", quiz1: 8.5, midterm: 16.5, status: "active" },
        { name: "Ahmed wael Adel Ebrahim", id: "22PO3O9", email: "awael5778@gmail.com", quiz1: 4.75, midterm: 10.5, status: "active" },
        { name: "Omar Mohamad Kamal", id: "", email: "", quiz1: null, midterm: 10, status: "partial" }   // special case: ID missing but we need to handle? Actually table shows ID column empty, but for lookup we include with special empty ID? We'll treat ID as empty string but we need to provide access? Better map as "N/A", but will not conflict. Given spec: student enters ID, we need to match with ID field. For Omar Mohamad Kamal there's no ID, but we can still store under special key? Better treat as "unknown-id" but won't be found by typical ID. However requirement: "enter id and then find his grades", so we will still store but only if someone enters empty? ignore. To be safe we keep in dataset with id as "" but we skip lookup unless empty string which is unlikely. We'll keep original data but for consistency we may omit but requirement is exactly based on given table, so we include.
    ];

    // Process: normalize ID mapping (trim and uppercase for case-insensitive match but store original)
    // For Omar Mohamad Kamal, the ID cell is empty in table, but we still keep as "N/A" to not break logic, but we will not allow lookup by empty string.
    // I'll assign a placeholder "NOID_OMAR" but better: no ID means they cannot use portal. But spec says student enter ID based on that table, but he has no ID. 
    // However given table has a row with missing ID, for usability we skip that row from ID lookup but display message? Actually we keep dataset but ID is ""; I'll add a protection.
    // We'll also handle absent midterm with custom display.
    const studentMap = new Map(); // key: normalized ID (uppercase trimmed) -> student object

    studentsRaw.forEach(s => {
        let rawId = s.id;
        if (rawId && rawId.trim() !== "") {
            const normalized = rawId.trim().toUpperCase();
            // store full object, also keep the raw ID display version
            studentMap.set(normalized, { ...s, originalId: rawId });
        } else {
            // For Omar Mohamad Kamal: since ID is empty, we still want to maybe show? but he can't be looked up via ID.
            // For completeness, we add a special entry: but user cannot enter empty. We'll store with key "OMAR_NOID" but not used. Instead we can show via alternative? not needed.
            // I'll keep it for reference but no lookup possible.
            if (s.name === "Omar Mohamad Kamal") {
                // store but under a key that will never be matched -> we may add a note but better just include in manual array.
                studentMap.set("$OMAR_NULL$", { ...s, originalId: "", hidden: true }); 
            }
        }
    });

    // Additionally fix Ahmed wael ID: "22PO3O9" (contains letter O and zero), keep as original.
    // Also we have IDs like "22p0018" -> uppercase match works.

    // Also treat Mohab Magdy midterm "absent" separately.
    // We'll store all in Map as defined.
    // One missing: Aly Mohamed Hussein email has "aly moahmed" but fine.
    // Edgecase: Ezzeldin ID: 22P0050 works.

    // --------------------- LocalStorage comments management -----------------
    const STORAGE_KEY_PREFIX = "grade_comment_";

    function getCommentKey(studentIdNorm) {
        return STORAGE_KEY_PREFIX + studentIdNorm;
    }

    function loadComment(studentIdNorm) {
        const key = getCommentKey(studentIdNorm);
        const saved = localStorage.getItem(key);
        return saved ? saved : "";
    }

    function saveComment(studentIdNorm, commentText) {
        const key = getCommentKey(studentIdNorm);
        localStorage.setItem(key, commentText);
    }

    // Helper to render result panel for a given student (normalized id & student object)
    function renderStudentGrades(student, normalizedIdForStorage) {
        const container = document.getElementById("resultContainer");
        if (!container) return;

        const quizValue = student.quiz1 !== undefined && student.quiz1 !== null ? student.quiz1 : "—";
        const midRaw = student.midterm;
        let midDisplay = "";
        let midClass = "";

        // check for absent or string absent
        if (midRaw === "absent" || (typeof midRaw === "string" && midRaw.toLowerCase() === "absent")) {
            midDisplay = `<span class="absent-tag"><i class="fas fa-user-slash"></i> Absent</span>`;
        } else if (midRaw !== undefined && midRaw !== null && !isNaN(parseFloat(midRaw))) {
            midDisplay = `${parseFloat(midRaw).toFixed(1)} <span class="grade-unit">/ 20</span>`;
        } else {
            midDisplay = "—";
        }

        const quizDisplay = (typeof quizValue === 'number') ? `${quizValue.toFixed(2)} <span class="grade-unit">/ 10</span>` : (quizValue === 0 ? `0.00 <span class="grade-unit">/ 10</span>` : "—");

        // Additional info: student email show if present
        const emailInfo = student.email ? `<div style="font-size:0.8rem; color:#5f7f9e; margin-top:6px;"><i class="far fa-envelope"></i> ${student.email}</div>` : '';

        const commentStorageId = normalizedIdForStorage;
        const savedComment = loadComment(commentStorageId);

        // Build HTML structure with comment block (dynamic, interactive)
        const html = `
            <div class="card grade-card" id="studentResultCard">
                <div class="student-identity">
                    <div>
                        <div class="student-name">${escapeHtml(student.name)}</div>
                        ${emailInfo}
                    </div>
                    <div class="student-id-badge"><i class="fas fa-qrcode"></i> ID: ${escapeHtml(student.originalId || student.id)}</div>
                </div>
                <div class="grades-grid">
                    <div class="grade-item">
                        <div class="grade-label"><i class="fas fa-pen-fancy"></i> Quiz 1</div>
                        <div class="grade-value">${quizDisplay}</div>
                        <div style="font-size:0.7rem; margin-top:6px;">max score 10</div>
                    </div>
                    <div class="grade-item">
                        <div class="grade-label"><i class="fas fa-chalkboard-user"></i> Midterm Exam</div>
                        <div class="grade-value">${midDisplay}</div>
                        <div style="font-size:0.7rem; margin-top:6px;">total 20 points</div>
                    </div>
                </div>
                <div class="comment-block" id="commentBlockSection">
                    <div class="comment-header">
                        <i class="far fa-sticky-note"></i> Instructor's notes & personal comment block
                        <span style="margin-left:auto; font-size:0.7rem; font-weight:normal;"><i class="fas fa-save"></i> auto-save to browser</span>
                    </div>
                    <div class="comment-body">
                        <textarea id="studentCommentArea" rows="3" placeholder="Write any comments, feedback, or reminders about performance, attendance, or improvement..."></textarea>
                        <div class="comment-actions">
                            <button class="btn-save" id="saveCommentBtn"><i class="fas fa-save"></i> Save comment</button>
                        </div>
                        <div id="commentFeedbackMsg" class="message-toast" style="min-height: 28px;"></div>
                    </div>
                </div>
            </div>
        `;

        container.innerHTML = html;

        // populate textarea with saved comment
        const textarea = document.getElementById("studentCommentArea");
        const saveBtn = document.getElementById("saveCommentBtn");
        const feedbackSpan = document.getElementById("commentFeedbackMsg");

        if (textarea) {
            textarea.value = savedComment;
        }

        // attach save event
        if (saveBtn) {
            saveBtn.addEventListener("click", () => {
                const newComment = textarea ? textarea.value : "";
                saveComment(commentStorageId, newComment);
                if (feedbackSpan) {
                    feedbackSpan.innerHTML = '<i class="fas fa-check-circle"></i> Comment saved successfully!';
                    setTimeout(() => {
                        if (feedbackSpan) feedbackSpan.innerHTML = '';
                    }, 2000);
                }
            });
        }
    }

    // simple escape html for security
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // show error not found
    function showNotFound(idEntered) {
        const container = document.getElementById("resultContainer");
        container.innerHTML = `
            <div class="card error-message">
                <i class="fas fa-user-slash" style="font-size: 1.6rem;"></i>
                <div>
                    <strong>No student found</strong><br>
                    We couldn't locate a student with ID <strong>"${escapeHtml(idEntered)}"</strong>. Please check the spelling or contact academic support.
                    <div style="margin-top: 10px; font-size:0.85rem;">📌 Hint: Use uppercase/lowercase format as shown on your ID card (e.g., 22P0234, 2201397).</div>
                </div>
            </div>
        `;
    }

    // handle lookup logic
    function performLookup() {
        const inputElement = document.getElementById("studentIdInput");
        let rawId = inputElement.value.trim();
        if (rawId === "") {
            // Show gentle warning
            const container = document.getElementById("resultContainer");
            container.innerHTML = `
                <div class="card" style="padding:1.5rem; text-align:center; background:#fff7e5;">
                    <i class="fas fa-info-circle" style="font-size:1.8rem; color:#e67e22;"></i>
                    <p style="margin-top:0.5rem;">Please enter your Student ID to see grades and comment block.</p>
                </div>
            `;
            return;
        }

        const normalizedInput = rawId.trim().toUpperCase();
        const studentRecord = studentMap.get(normalizedInput);

        if (!studentRecord) {
            showNotFound(rawId);
            return;
        }

        // For the case of hidden special ID (Omar with empty) we skip but that won't match.
        // Also ensure that we treat midterm absent correctly.
        // generate normalized storage key based on the actual ID for comments: we use normalizedInput (clean)
        const storageKeyForComments = normalizedInput;
        renderStudentGrades(studentRecord, storageKeyForComments);
    }

    // clear and reset
    function resetLookup() {
        const inputField = document.getElementById("studentIdInput");
        if (inputField) inputField.value = "";
        const container = document.getElementById("resultContainer");
        container.innerHTML = `
            <div class="card" style="background:#ffffff; border-radius: 32px; padding: 2rem; text-align: center; color:#4a627a;">
                <i class="fas fa-arrow-up" style="font-size: 2rem; opacity: 0.6; margin-bottom: 0.5rem; display: inline-block;"></i>
                <p>Enter a valid student ID above to view quiz, midterm scores and personal comment section.</p>
                <div style="margin-top: 1rem; font-size: 0.8rem;"><i class="fas fa-id-card"></i> </div>
            </div>
        `;
    }

    // event binding and initial state
    document.addEventListener("DOMContentLoaded", () => {
        const lookupBtn = document.getElementById("lookupBtn");
        const resetBtn = document.getElementById("resetBtn");
        const idInput = document.getElementById("studentIdInput");

        if (lookupBtn) lookupBtn.addEventListener("click", performLookup);
        if (resetBtn) resetBtn.addEventListener("click", resetLookup);
        if (idInput) {
            idInput.addEventListener("keypress", (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    performLookup();
                }
            });
        }
        // initial placeholder message
        resetLookup();
    });
</script>
</body>
</html>
