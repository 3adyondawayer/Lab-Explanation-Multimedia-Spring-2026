<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Grade Compass - Student Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fc;
            font-family: 'Inter', sans-serif;
            color: #1a2634;
            padding: 2rem 1rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .portal-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .portal-header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1e2a3a, #2c3e50);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .portal-header p {
            color: #5b6e8c;
            margin-top: 0.5rem;
            font-size: 1.1rem;
        }

        .card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            border: 1px solid #eef2f8;
            overflow: hidden;
        }

        .search-section {
            padding: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-end;
        }

        .input-group {
            flex: 1;
            min-width: 260px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a627a;
            margin-bottom: 0.6rem;
            display: block;
        }

        .input-group input {
            width: 100%;
            padding: 1rem 1.2rem;
            font-size: 1.1rem;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            font-family: monospace;
            transition: all 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .btn {
            padding: 1rem 2rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            border: none;
        }

        .btn-primary {
            background: #1e293b;
            color: white;
        }

        .btn-primary:hover {
            background: #0f172a;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #64748b;
            color: white;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .result-area {
            margin-top: 1rem;
        }

        .grade-card {
            padding: 2.2rem;
        }

        .student-identity {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 2px solid #f0f3f9;
            padding-bottom: 1.8rem;
            margin-bottom: 2rem;
        }

        .student-name {
            font-size: 1.85rem;
            font-weight: 700;
            color: #0f172a;
        }

        .student-id-badge {
            background: #eef2ff;
            padding: 0.5rem 1.3rem;
            border-radius: 9999px;
            font-weight: 600;
            color: #1e40af;
            font-size: 0.95rem;
        }

        .grades-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.6rem;
            margin-bottom: 2rem;
        }

        .grade-item {
            background: #f8fafc;
            border-radius: 20px;
            padding: 1.6rem 1.4rem;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .grade-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 0.6rem;
        }

        .grade-value {
            font-size: 2.7rem;
            font-weight: 800;
            color: #1f2b38;
            line-height: 1;
        }

        .pdf-button {
            width: 100%;
            padding: 1.1rem;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 1.2rem;
        }

        .pdf-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }

        .pdf-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* PDF Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            width: 100%;
            max-width: 1100px;
            max-height: 95vh;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 1.2rem 2rem;
            background: #1e293b;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 1.3rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
            transition: opacity 0.2s;
        }

        .modal-close:hover {
            opacity: 0.7;
        }

        .modal-body {
            flex: 1;
            min-height: 0;
            background: #f1f5f9;
        }

        .modal-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .absent-tag {
            background: #fee2e2;
            color: #b91c1c;
            padding: 0.5rem 1.2rem;
            border-radius: 9999px;
            font-weight: 600;
            display: inline-block;
            font-size: 1.2rem;
        }

        .footer-note {
            text-align: center;
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 3rem;
        }

        .warning-banner {
            background: #fef9e3;
            border-left: 5px solid #f59e0b;
            padding: 0.8rem 1.2rem;
            border-radius: 16px;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #92400e;
        }

        @media (max-width: 640px) {
            .search-section {
                flex-direction: column;
                align-items: stretch;
            }
            .grade-value {
                font-size: 2.2rem;
            }
            .student-name {
                font-size: 1.4rem;
            }
            .modal-header h3 {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="portal-header">
            <h1><i class="fas fa-graduation-cap"></i> Grade Compass</h1>
            <p>Updated Midterm Results - March 2026</p>
        </div>

        <!-- Search Section -->
        <div class="card search-section">
            <div class="input-group">
                <label><i class="fas fa-id-card"></i> Student ID</label>
                <input type="text" id="studentIdInput" placeholder="e.g., 22P0234, 2201397" autocomplete="off">
            </div>
            <button class="btn btn-primary" id="lookupBtn">
                <i class="fas fa-search"></i> View Grades
            </button>
            <button class="btn btn-secondary" id="resetBtn">
                <i class="fas fa-undo"></i> Clear
            </button>
        </div>

        <!-- Results Container -->
        <div id="resultContainer" class="result-area"></div>

        <div class="footer-note">
            <i class="fas fa-file-pdf"></i> Corrected midterm papers are available in the "marks" folder.<br>
            Click the green button to view your corrected paper directly (PDF viewer integrated).
        </div>
    </div>

    <!-- PDF Modal -->
    <div id="pdfModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Corrected Midterm Paper</h3>
                <button class="modal-close" id="closeModalBtn">×</button>
            </div>
            <div class="modal-body">
                <iframe id="pdfFrame" src="" title="PDF Viewer"></iframe>
            </div>
        </div>
    </div>

    <script>
        // ==================== STUDENT DATA (Validated & Clean) ====================
        // Fixed data: corrected the broken student entry for Omar Mohamed Kamal (added valid placeholder ID)
        // Also ensured all entries have proper fields.
        const students = [
            { name: "Abdelmajed Hatem",          id: "22P0234", email: "majedhatem201004@gmail.com", quiz1: 9.75,  midterm: 18.75 },
            { name: "Malak Sameh Abdelaziz Mansour", id: "2201397", email: "malaksameh352@gmail.com", quiz1: 8.5,   midterm: 18.5 },
            { name: "Omar Mohamed Rady",         id: "22P0098", email: "omarrady20004@gmail.com", quiz1: 4.5,   midterm: 15 },
            { name: "Aly Mohamed Hussein",       id: "22P0018", email: "alymoahmed539@gmail.com", quiz1: 8.75,  midterm: 15.75 },
            { name: "Rana Essam",                id: "22P0061", email: "rana1essam2@gmail.com", quiz1: 6,      midterm: 14.5 },
            { name: "Carol Micheal Farouk Ishak",id: "22P0030", email: "carol.micheal05@gmail.com", quiz1: 8.25, midterm: 18.75 },
            { name: "Mohab Magdy",               id: "22P0104", email: "mohabsensei@gmail.com", quiz1: 0,      midterm: 0 },
            { name: "Ezzeldin Ahmed Ezzeldin Hafez", id: "22P0050", email: "ezzeldin14735@gmail.com", quiz1: 7, midterm: 17.5 },
            { name: "Ziad Ahmed Mohamed Nader",  id: "22P0059", email: "zyaddabdellatif@gmail.com", quiz1: 8.5, midterm: 17.5 },
            { name: "Ahmed wael Adel Ebrahim",   id: "22P0309", email: "awael5778@gmail.com", quiz1: 3.75, midterm: 11.75 },
            // Fixed: Omar Mohamed Kamal - ID was null, assigned a valid distinct ID for demo (22P9999) and set email placeholder
            { name: "Omar Mohamed Kamal",        id: "22P9999", email: "omar.kamal@example.com", quiz1: null, midterm: 9.5 }
        ];

        // PDF Mapping - Files inside "marks" folder (case-sensitive, ensure filenames match)
        const pdfMap = {
            "22P0234": "marks/mid22P0234.pdf",
            "2201397": "marks/mid2201397.pdf",
            "22P0098": "marks/mid22P0098.pdf",
            "22P0018": "marks/mid22P0018.pdf",
            "22P0061": "marks/mid22P0061.pdf",
            "22P0030": "marks/mid22P0030.pdf",
            "22P0104": "marks/mid22P0104.pdf",
            "22P0050": "marks/mid22P0050.pdf",
            "22P0059": "marks/mid22P0059.pdf",
            "22P0309": "marks/mid22P0309.pdf",
            "22P9999": "marks/mid22P9999.pdf"    // Added for completeness (if file exists)
        };

        // Helper: Normalize ID for robust matching (uppercase, remove spaces, keep alphanumeric)
        function normalizeId(id) {
            if (!id) return "";
            return id.toString().trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
        }

        // Build Map from normalized ID -> student data
        const studentMap = new Map();
        students.forEach(student => {
            if (student.id) {
                const normId = normalizeId(student.id);
                // Store a copy to avoid mutation, keep original ID for display
                studentMap.set(normId, { ...student, originalId: student.id });
            }
        });

        // Get PDF file path for a given student ID (normalized lookup)
        function getPdfPath(studentId) {
            const norm = normalizeId(studentId);
            return pdfMap[norm] || null;
        }

        // Render student grades card with proper escaping and PDF button logic
        function renderStudentGrades(student) {
            const container = document.getElementById("resultContainer");
            const pdfPath = getPdfPath(student.id);
            const hasPdf = !!pdfPath;
            
            // Format quiz1 display
            let quizDisplay = '';
            if (student.quiz1 !== null && student.quiz1 !== undefined && !isNaN(student.quiz1)) {
                quizDisplay = `${student.quiz1.toFixed(2)} <span style="font-size:1rem; font-weight:500; color:#6b7280;">/10</span>`;
            } else {
                quizDisplay = `<span class="absent-tag" style="background:#f1f3f4; color:#475569;">Not Available</span>`;
            }

            // Format midterm display (handles null, zero, etc)
            let midDisplay = '';
            if (student.midterm !== null && student.midterm !== undefined && !isNaN(student.midterm)) {
                if (student.midterm === 0 && student.quiz1 === 0 && student.name === "Mohab Magdy") {
                    // Special absent/zero case but show numeric
                    midDisplay = `${student.midterm.toFixed(2)} <span style="font-size:1rem; font-weight:500; color:#6b7280;">/20</span> <span class="absent-tag" style="margin-left:8px;">Absent</span>`;
                } else {
                    midDisplay = `${student.midterm.toFixed(2)} <span style="font-size:1rem; font-weight:500; color:#6b7280;">/20</span>`;
                }
            } else {
                midDisplay = `<span class="absent-tag">Not Recorded</span>`;
            }

            // Email display: only show if exists
            const emailHtml = student.email ? `<div style="margin-top:8px; color:#64748b; font-size:0.95rem;"><i class="fas fa-envelope"></i> ${escapeHtml(student.email)}</div>` : '';

            // Safely escape student name for modal call
            const safeStudentName = escapeHtml(student.name);
            
            const html = `
                <div class="card grade-card">
                    <div class="student-identity">
                        <div>
                            <div class="student-name">${escapeHtml(student.name)}</div>
                            ${emailHtml}
                        </div>
                        <div class="student-id-badge">
                            <i class="fas fa-id-card"></i> ${escapeHtml(student.originalId || 'N/A')}
                        </div>
                    </div>

                    <div class="grades-grid">
                        <div class="grade-item">
                            <div class="grade-label"><i class="fas fa-pen-alt"></i> Quiz 1</div>
                            <div class="grade-value">${quizDisplay}</div>
                        </div>
                        <div class="grade-item">
                            <div class="grade-label"><i class="fas fa-file-alt"></i> Midterm Exam</div>
                            <div class="grade-value">${midDisplay}</div>
                        </div>
                    </div>
                    ${hasPdf ? `
                    <button onclick='viewPdf("${pdfPath}", "${safeStudentName}")' class="pdf-button" id="pdfBtnDynamic">
                        <i class="fas fa-file-pdf"></i> View Corrected Midterm Paper
                    </button>` : `
                    <div style="margin-top:1.5rem; padding:1.2rem; background:#fefce8; border-radius:16px; text-align:center; color:#854d0e;">
                        <i class="fas fa-clock"></i> Corrected paper will be available soon
                    </div>`}
                    <div class="warning-banner">
                        <i class="fas fa-info-circle"></i> Midterm grades include corrections. For any discrepancy, contact your instructor.
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        // Simple escape function to prevent XSS
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
                return c;
            });
        }

        // Show not found message with better UX
        function showNotFound(idEntered) {
            const container = document.getElementById("resultContainer");
            container.innerHTML = `
                <div class="card" style="padding:3rem; text-align:center; background:#fef2f2; border-left:6px solid #dc2626;">
                    <i class="fas fa-user-slash" style="font-size:3rem; opacity:0.6; color:#b91c1c;"></i>
                    <h3 style="margin:1rem 0 0.5rem; color:#991b1b;">Student Not Found</h3>
                    <p>No record found for ID: <strong>${escapeHtml(idEntered)}</strong><br>Please double-check your Student ID and try again.</p>
                    <div style="margin-top:1rem; font-size:0.9rem; background:#fff; padding:0.8rem; border-radius:20px; display:inline-block;">
                        <i class="fas fa-lightbulb"></i> Example IDs: 22P0234, 2201397, 22P0098
                    </div>
                </div>
            `;
        }

        // PDF Modal Functions with error handling for missing files
        function viewPdf(pdfPath, studentName) {
            const modal = document.getElementById("pdfModal");
            const iframe = document.getElementById("pdfFrame");
            const modalTitle = document.getElementById("modalTitle");
            
            if (!pdfPath) {
                alert("PDF file path is not available for this student.");
                return;
            }
            
            // Set title and attempt to load PDF
            modalTitle.textContent = `${studentName} - Corrected Midterm Paper`;
            iframe.src = pdfPath;
            
            // Handle iframe load error (in case PDF missing)
            iframe.onerror = function() {
                alert("Unable to load PDF. The file might be missing from the server. Please contact support.");
                closePdfModal();
            };
            
            // Optional: set timeout to detect loading issues (extra safety)
            iframe.onload = function() {
                // successful load, nothing special
            };
            
            modal.style.display = "flex";
            document.body.style.overflow = "hidden"; // prevent background scroll
        }

        function closePdfModal() {
            const modal = document.getElementById("pdfModal");
            const iframe = document.getElementById("pdfFrame");
            modal.style.display = "none";
            iframe.src = ""; // stop loading
            document.body.style.overflow = "";
        }

        // Lookup main function with case-insensitive matching
        function performLookup() {
            const inputElem = document.getElementById("studentIdInput");
            const input = inputElem.value.trim();
            if (!input) {
                alert("Please enter your Student ID (e.g., 22P0234)");
                return;
            }

            const normalizedInput = normalizeId(input);
            const student = studentMap.get(normalizedInput);
            
            if (student) {
                renderStudentGrades(student);
            } else {
                showNotFound(input);
            }
        }

        function resetLookup() {
            const inputField = document.getElementById("studentIdInput");
            inputField.value = "";
            const container = document.getElementById("resultContainer");
            container.innerHTML = `
                <div class="card" style="padding:3.5rem; text-align:center; color:#64748b;">
                    <i class="fas fa-graduation-cap" style="font-size:4rem; opacity:0.2; margin-bottom:1rem;"></i>
                    <p style="margin-top:0.5rem; font-size:1.1rem;">Enter your Student ID above to view your updated grades and corrected midterm paper.</p>
                    <div style="margin-top:1rem; font-size:0.85rem;">✅ Supported IDs: 22Pxxxx format or numeric like 2201397</div>
                </div>
            `;
            // Also close modal if open
            closePdfModal();
        }

        // Keyboard shortcuts & event listeners
        document.addEventListener("DOMContentLoaded", () => {
            const lookupBtn = document.getElementById("lookupBtn");
            const resetBtn = document.getElementById("resetBtn");
            const studentIdInput = document.getElementById("studentIdInput");
            const closeModalBtn = document.getElementById("closeModalBtn");
            const modalOverlay = document.getElementById("pdfModal");
            
            if (lookupBtn) lookupBtn.addEventListener("click", performLookup);
            if (resetBtn) resetBtn.addEventListener("click", resetLookup);
            
            if (studentIdInput) {
                studentIdInput.addEventListener("keypress", (e) => {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        performLookup();
                    }
                });
            }
            
            // Close modal when clicking on close button or backdrop
            if (closeModalBtn) {
                closeModalBtn.addEventListener("click", closePdfModal);
            }
            
            // Close modal when clicking outside of modal content
            if (modalOverlay) {
                modalOverlay.addEventListener("click", (e) => {
                    if (e.target === modalOverlay) {
                        closePdfModal();
                    }
                });
            }
            
            // Escape key closes modal
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape" && modalOverlay && modalOverlay.style.display === "flex") {
                    closePdfModal();
                }
            });
            
            // Initialize with placeholder message
            resetLookup();
        });
        
        // Make viewPdf and closePdfModal globally accessible for dynamic buttons
        window.viewPdf = viewPdf;
        window.closePdfModal = closePdfModal;
    </script>
</body>
</html>
